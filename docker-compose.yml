version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: taskorg-db
    restart: always
    environment:
      POSTGRES_USER: taskorg_user
      POSTGRES_PASSWORD: taskorg_pass
      POSTGRES_DB: taskorg_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: